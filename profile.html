<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hồ Sơ — Phong Nhân Thánh Vực</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body data-protected="true">

  <div id="app-shell">

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <span class="brand-mark">🏯</span>

        <span>
          Phong Nhân<br>
          Thánh Vực
        </span>
      </div>

      <nav>
        <a class="nav-link" href="index.html">
          🏯 Tổng Quan
        </a>

        <a class="nav-link active" href="profile.html">
          👤 Hồ Sơ
        </a>

        <a class="nav-link" href="chat.html">
          💬 Chat
        </a>

        <a class="nav-link" href="groups.html">
          👥 Nhóm
        </a>

        <hr>

        <a class="nav-link" href="#links">
          🔗 Liên Kết
        </a>
      </nav>

      <button id="logoutBtn" class="btn btn-ghost">
        Đăng xuất
      </button>

    </aside>

    <header class="mobile-bar">

      <button
        id="menuBtn"
        class="icon-btn"
        aria-label="Mở menu"
      >
        ☰
      </button>

      <strong>Hồ Sơ</strong>

    </header>

    <main class="main-content">

      <section class="page-head">

        <p class="eyebrow">
          THÀNH VIÊN
        </p>

        <h1>Hồ Sơ</h1>

      </section>

      <section class="profile-card">

        <div
          class="avatar"
          id="avatar"
        >
          👤
        </div>

        <div>

          <h2 id="displayName">
            Đang tải...
          </h2>

          <p
            id="email"
            class="muted"
          >
            ...
          </p>

          <span
            id="status"
            class="status"
          >
            Đang kiểm tra...
          </span>

        </div>

      </section>

      <form
        id="profileForm"
        class="form-card"
      >

        <label>
          Tên hiển thị

          <input
            id="nameInput"
            type="text"
            maxlength="80"
            required
          >
        </label>

        <label>
          Bio

          <textarea
            id="bioInput"
            maxlength="500"
            rows="5"
            placeholder="Giới thiệu đôi chút về bản thân..."
          ></textarea>

        </label>

        <button
          class="btn"
          type="submit"
        >
          Lưu thay đổi
        </button>

        <p
          id="message"
          class="message"
        ></p>

      </form>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>

  <script src="js/auth.js"></script>

  <script src="js/profile.js"></script>

  <script src="js/app.js"></script>

</body>

</html>
